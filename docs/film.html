<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Страница фильма Studio Ghibli.">
  <title>Ghibli Museum — фильм</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    @view-transition { navigation: auto; }
  </style>
</head>
<body>
  <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
  <header class="site-header">
    <a class="logo" href="index.html">Ghibli Museum</a>
    <nav id="main-nav" aria-label="Main">
      <a href="index.html#hero" data-i18n="nav.home">Главная</a>
      <a href="index.html#timeline" data-i18n="nav.timeline">Таймлайн</a>
      <a href="index.html#films" data-i18n="nav.films">Фильмы</a>
      <a href="index.html#player" data-i18n="nav.player">Плеер</a>
      <a href="index.html#about" data-i18n="nav.about">О проекте</a>
    </nav>
    <div class="lang-switch" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="burger" aria-label="Menu" aria-expanded="false">☰</button>
  </header>

  <main>
    <section class="film-hero" id="film-hero">
      <div class="film-hero-bg" id="film-hero-bg"></div>
      <div class="container film-hero-content">
        <h1 class="film-title" id="film-title" data-reveal><span>Загрузка…</span></h1>
        <p class="film-meta" id="film-meta"></p>
      </div>
    </section>

    <section class="container film-body" id="film-content" hidden>
      <h2 data-i18n="film.synopsis">Синопсис</h2>
      <p id="film-synopsis"></p>

      <h2 data-i18n="film.facts">Факты</h2>
      <ul id="film-facts"></ul>

      <h2 data-i18n="film.watch">Где смотреть</h2>
      <div id="film-watch"></div>

      <div id="film-player-slot" class="player-slot">
        <p class="muted">Трейлер скоро.</p>
      </div>

      <nav class="film-neighbors">
        <a id="prev-film" href="index.html#films">← Предыдущий</a>
        <a id="next-film" href="index.html#films">Следующий →</a>
      </nav>
    </section>

    <section class="container" id="film-empty" hidden>
      <div class="empty">
        <p>Фильм с таким идентификатором не найден.</p>
        <a class="back-link" href="index.html">Вернуться на главную</a>
      </div>
    </section>
  </main>

  <script src="js/vendor/lenis.min.js"></script>
  <script type="module" src="js/film.js"></script>
</body>
</html>
